services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quota_db
      POSTGRES_USER: quota_app
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U quota_app -d quota_db
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: quota_db
      DB_USER: quota_app
      DB_PASSWORD: local_dev_password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: